<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'"/>
<title>JUNDSH Float</title>
<style>
  /* 桌面悬浮鲸鱼：官方黑色标识，透明底，悬空于桌面 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    user-select: none;
  }
  #whale-shell {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    -webkit-app-region: drag; /* 整窗可拖动 */
    cursor: grab;
  }
  #whale-shell:active { cursor: grabbing; }

  /* 鲸鱼：悬空视觉 = 柔和投影 + 泛光，深色桌面也清晰 */
  #whale {
    width: 128px; height: 128px;
    pointer-events: none;
    filter:
      drop-shadow(0 6px 16px rgba(11, 18, 32, 0.42))
      drop-shadow(0 0 22px rgba(103, 158, 254, 0.28));
    animation: floaty 4s ease-in-out infinite;
  }
  @keyframes floaty {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-7px) rotate(2deg); }
  }

  /* 悬停响应（靠 -webkit-app-region:no-drag 让下方按钮可点） */
  #menu {
    position: absolute;
    bottom: 4px; right: 4px;
    -webkit-app-region: no-drag;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s;
  }
  html.menu-open #menu, #whale-shell:hover #menu { opacity: 1; pointer-events: auto; }

  #menu-inner {
    position: absolute;
    right: 0; bottom: 100%;
    margin-bottom: 8px;
    min-width: 168px;
    padding: 6px;
    border-radius: 12px;
    background: rgba(26, 28, 33, 0.92);
    backdrop-filter: blur(18px);
    border: 1px solid hsla(0, 0%, 100%, 0.1);
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5);
    display: flex; flex-direction: column;
    gap: 2px;
  }
  #menu-inner.hidden { display: none; }
  .mi {
    display: flex; align-items: center; gap: 10px;
    height: 34px; padding: 0 12px;
    border: none; background: transparent;
    border-radius: 8px;
    color: #d7dce3;
    font-size: 12.5px; font-family: inherit;
    cursor: pointer;
    text-align: left;
  }
  .mi:hover { background: hsla(0, 0%, 100%, 0.08); }
  .mi .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #3a3f47;
  }
  .mi .dot.ok { background: #28c840; box-shadow: 0 0 8px rgba(40, 200, 64, 0.8); }
  .mi .dot.err { background: #ff5f57; box-shadow: 0 0 8px rgba(255, 95, 87, 0.8); }
  .mi .grow { flex: 1; }
  .sep { height: 1px; background: hsla(0, 0%, 100%, 0.08); margin: 4px 8px; }
  .mi.danger { color: #ff8f89; }
</style>
</head>
<body>
  <div id="whale-shell">
    <img id="whale" src="../assets/float-whale-black.svg" alt="" draggable="false"/>
    <div id="menu">
      <div id="menu-inner" class="hidden"></div>
    </div>
  </div>
  <script src="float.js"></script>
</body>
</html>
