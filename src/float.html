<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"/>
<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; img-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self'"/>
<title>JUNDSH Float</title>
<style>
  /* 桌面悬浮鲸鱼：官方黑色标识，透明底，悬空于桌面 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body {
    height: 100%;
    overflow: hidden;
    background: transparent;
    font-family: "Segoe UI Variable Text", "Segoe UI", "Microsoft YaHei UI", system-ui, sans-serif;
    user-select: none;
  }
  #whale-shell {
    position: absolute; inset: 0;
    display: grid; place-items: center;
    /* 手动拖动经 IPC 实现，不设 -webkit-app-region: drag，保证 click/dblclick 可用 */
    cursor: grab;
  }
  #whale-shell.dragging { cursor: grabbing; }

  /* 鲸鱼光晕色随皮肤（默认深海青蓝；石墨蓝皮肤见下方覆盖） */
  :root { --whale-glow: rgba(76, 194, 255, 0.28); --whale-glow-strong: rgba(76, 194, 255, 0.6); }
  html.skin-graphite { --whale-glow: rgba(103, 158, 254, 0.28); --whale-glow-strong: rgba(103, 158, 254, 0.6); }

  /* 鲸鱼：悬空视觉 = 柔和投影 + 泛光，深色桌面也清晰 */
  #whale {
    width: 116px; height: 116px;
    pointer-events: none;
    filter:
      drop-shadow(0 6px 16px rgba(11, 18, 32, 0.42))
      drop-shadow(0 0 22px var(--whale-glow));
    animation: floaty 4s ease-in-out infinite;
    transition: width 0.22s ease, height 0.22s ease;
  }
  /* ---- 连接状态光效（由 float.js 按 dsh-svc 状态切换类） ---- */
  /* 在线：品牌荧光呼吸 */
  #whale.online {
    animation: floaty 4s ease-in-out infinite, breathe 3s ease-in-out infinite;
    filter:
      drop-shadow(0 6px 16px rgba(11, 18, 32, 0.42))
      drop-shadow(0 0 26px var(--whale-glow-strong));
  }
  /* 连接中/尝试中：琥珀黄脉冲 */
  #whale.connecting {
    animation: floaty 4s ease-in-out infinite, pulse-glow 1.1s ease-in-out infinite;
    filter:
      drop-shadow(0 6px 16px rgba(11, 18, 32, 0.42))
      drop-shadow(0 0 22px rgba(254, 188, 46, 0.55));
  }
  /* 离线：灰红光微弱提示，不刺眼 */
  #whale.offline {
    animation: floaty 4s ease-in-out infinite, pulse-glow 2.4s ease-in-out infinite;
    filter:
      drop-shadow(0 6px 16px rgba(11, 18, 32, 0.42))
      drop-shadow(0 0 14px rgba(160, 82, 78, 0.4));
  }
  @keyframes breathe {
    0%, 100% { filter: drop-shadow(0 6px 16px rgba(11, 18, 32, 0.42)) drop-shadow(0 0 14px var(--whale-glow)); }
    50% { filter: drop-shadow(0 6px 16px rgba(11, 18, 32, 0.42)) drop-shadow(0 0 34px var(--whale-glow-strong)); }
  }
  @keyframes pulse-glow {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.72; }
  }
  /* 贴边吸附时的收起态 */
  html.snapped #whale { width: 34px; height: 34px; }
  html.snapped:not(:hover) #whale-shell { cursor: pointer; }
  @keyframes floaty {
    0%, 100% { transform: translateY(0) rotate(-2deg); }
    50% { transform: translateY(-7px) rotate(2deg); }
  }

  /* 悬停响应（靠 -webkit-app-region:no-drag 让下方按钮可点） */
  #menu {
    position: absolute;
    bottom: 4px; right: 4px;
    -webkit-app-region: no-drag;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.18s;
  }
  html.menu-open #menu, #whale-shell:hover #menu { opacity: 1; pointer-events: auto; }

  #menu-inner {
    position: absolute;
    right: 0; bottom: 100%;
    margin-bottom: 8px;
    min-width: 168px;
    padding: 6px;
    border-radius: 12px;
    background: rgba(9, 18, 33, 0.92);
    backdrop-filter: blur(18px);
    border: 1px solid rgba(140, 214, 255, 0.26);
    box-shadow: 0 14px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 hsla(0, 0%, 100%, 0.05);
    display: flex; flex-direction: column;
    gap: 2px;
  }
  /* 吸附到右边缘时菜单向左侧展开，避免溢出屏幕 */
  html[data-snap="right"] #menu-inner { right: auto; left: 0; }
  #menu-inner.hidden { display: none; }
  .mi {
    display: flex; align-items: center; gap: 10px;
    height: 34px; padding: 0 12px;
    border: none; background: transparent;
    border-radius: 8px;
    color: #d7dce3;
    font-size: 12.5px; font-family: inherit;
    cursor: pointer;
    text-align: left;
  }
  .mi:hover { background: rgba(96, 176, 235, 0.14); }
  /* 皮肤 accent 协调：悬浮窗菜单强调色跟随主窗皮肤（默认深海青蓝） */
  html.skin-graphite #menu-inner { border-color: hsla(0, 0%, 100%, 0.1); }
  html.skin-graphite .mi:hover { background: hsla(0, 0%, 100%, 0.08); }
  html.skin-violet #menu-inner { border-color: rgba(167, 139, 250, 0.35); }
  html.skin-violet .mi:hover { background: rgba(167, 139, 250, 0.16); }
  html.skin-violet .mi .dot.ok { box-shadow: 0 0 8px rgba(167, 139, 250, 0.8); }
  html.skin-emerald #menu-inner { border-color: rgba(52, 211, 153, 0.35); }
  html.skin-emerald .mi:hover { background: rgba(52, 211, 153, 0.16); }
  html.skin-emerald .mi .dot.ok { box-shadow: 0 0 8px rgba(52, 211, 153, 0.8); }
  html.skin-amber #menu-inner { border-color: rgba(251, 191, 36, 0.35); }
  html.skin-amber .mi:hover { background: rgba(251, 191, 36, 0.16); }
  html.skin-amber .mi .dot.ok { box-shadow: 0 0 8px rgba(251, 191, 36, 0.8); }
  .mi .dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: #3a3f47;
  }
  .mi .dot.ok { background: #28c840; box-shadow: 0 0 8px rgba(40, 200, 64, 0.8); }
  .mi .dot.err { background: #ff5f57; box-shadow: 0 0 8px rgba(255, 95, 87, 0.8); }
  .mi .grow { flex: 1; }
  .sep { height: 1px; background: hsla(0, 0%, 100%, 0.08); margin: 4px 8px; }
  .mi.danger { color: #ff8f89; }
</style>
</head>
<body>
  <div id="whale-shell">
    <img id="whale" src="../assets/float-whale-black.svg" alt="" draggable="false"/>
    <div id="menu">
      <div id="menu-inner" class="hidden"></div>
    </div>
  </div>
  <script src="settings-schema.js"></script>
  <script src="float.js"></script>
</body>
</html>
